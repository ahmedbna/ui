# Local stack configuration, read by `supabase start` and `supabase db reset`.
# A linked project ignores everything here except [db].major_version, which must
# match your remote database or `db push` refuses to run.
#
# `project_id` is overwritten by `supabase link`.
project_id = "bna"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Catches every email the local stack sends — magic links, OTPs, confirmations —
# at http://localhost:54324 instead of delivering them.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Must match `scheme` in app.json, or OAuth and magic links redirect nowhere.
site_url = "bna://"
additional_redirect_urls = ["bna://", "exp://localhost:8081", "http://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Off locally so sign-up returns a session immediately. Leave it ON in
# production — see the deployment guide.
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
