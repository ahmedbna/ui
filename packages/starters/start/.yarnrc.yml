# Yarn 2+ installs Plug'n'Play by default: a .pnp.cjs resolver and no
# node_modules directory at all. Metro and React Native's autolinking both read
# node_modules off disk and have no PnP resolver, so `expo start` in a
# PnP project fails before it bundles anything.
#
# The node-modules linker is what `create-expo-app` sets for Yarn 2+ too. Yarn
# 1.x reads .yarnrc rather than this file and is flat already, so it ignores it.
nodeLinker: node-modules
