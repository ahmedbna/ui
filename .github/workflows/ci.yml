name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Registry validation runs inside `build`: an entry with a missing file,
      # an unknown dependency, a duplicate key or a cycle fails the PR here
      # rather than reaching a user's `bna-ui add`.
      - run: pnpm turbo run build

      # And the payloads must stay self-contained — every `@/…` import a
      # component makes has to ship in the same response.
      - name: Verify registry payload contract
        run: pnpm --filter @bna-ui/registry verify

      # Diffs meta/<name>.ts's documented props against each component's
      # actual exported prop type. Non-blocking: `meta/` covers 78 components
      # by hand, and a false positive here shouldn't hold up an unrelated PR.
      # Read the job summary for findings; promote to a hard failure once the
      # signal-to-noise ratio has earned it (see AUDIT.md Phase 8).
      - name: Check meta.ts prop drift
        continue-on-error: true
        run: pnpm --filter @bna-ui/registry check-meta-drift

      - run: pnpm turbo run typecheck
      - run: pnpm turbo run test
      - run: pnpm turbo run lint
      - run: pnpm format:check

      # Turbo's tasks say nothing about whether the installed versions actually
      # match the Expo SDK the playground declares. This is the check that keeps
      # the component source and the SDK from drifting apart again.
      - name: Playground matches its Expo SDK
        working-directory: apps/playground
        run: |
          npx expo install --check
          npx expo-doctor

  cli-e2e:
    name: CLI end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

      # Serve the generated payloads exactly as the docs site will, then drive
      # the real CLI against them. This is the only check that exercises the
      # fetch path end to end.
      - name: Serve the registry
        run: |
          npx --yes serve apps/docs/public -l 4321 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4321/r/index.json > /dev/null && break
            sleep 1
          done

      - name: Scaffold and add a component
        run: |
          set -euo pipefail
          bna() { node "$GITHUB_WORKSPACE/packages/cli/bin/bna-ui.js" "$@"; }
          mkdir -p /tmp/e2e && cd /tmp/e2e

          bna init app --skip-install
          cd app
          test -f .gitignore || { echo "::error::init produced no .gitignore"; exit 1; }
          test -f components.json || { echo "::error::init produced no components.json"; exit 1; }

          bna add button --registry http://localhost:4321/r --yes

          # `add` must refuse to write into a project whose imports cannot
          # resolve; the components it writes all import through `@/…`.
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('tsconfig.json', 'utf8').replace(/,(\s*[}\]])/g, '\$1'));
            delete c.compilerOptions.paths;
            fs.writeFileSync('tsconfig.alias-removed.json', JSON.stringify(c, null, 2));
          "
          mv tsconfig.json tsconfig.keep.json && mv tsconfig.alias-removed.json tsconfig.json
          if bna add avatar --registry http://localhost:4321/r --yes 2>/dev/null; then
            echo "::error::add succeeded without an @/* path alias"; exit 1
          fi
          mv tsconfig.keep.json tsconfig.json

      # `--dry-run` must never prompt, or it is unusable from a script, and the
      # discovery commands must work against the same served registry.
      - name: Non-interactive commands
        run: |
          set -euo pipefail
          bna() { node "$GITHUB_WORKSPACE/packages/cli/bin/bna-ui.js" "$@"; }
          cd /tmp/e2e/app
          export BNA_UI_REGISTRY=http://localhost:4321/r

          bna add avatar --dry-run < /dev/null | grep -q 'Dry run'
          test ! -f components/ui/avatar.tsx || { echo "::error::--dry-run wrote a file"; exit 1; }

          bna list --json | node -e "
            let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
              const items = JSON.parse(s);
              if (!items.length) { console.error('::error::list returned nothing'); process.exit(1); }
            })"
          bna search button | grep -q button
          bna info button --json | node -e "
            let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
              if (JSON.parse(s).name !== 'button') { console.error('::error::info returned the wrong bundle'); process.exit(1); }
            })"

      # The convex and supabase scaffolds were never built in CI, so the
      # `env.example` -> `.env.example` and `github` -> `.github` renames and the
      # config.toml rewrite went unverified.
      - name: Scaffold the backend variants
        run: |
          set -euo pipefail
          bna() { node "$GITHUB_WORKSPACE/packages/cli/bin/bna-ui.js" "$@"; }
          mkdir -p /tmp/e2e-backends && cd /tmp/e2e-backends

          bna convex cx --no-auth --skip-convex --skip-install
          test -f cx/convex/schema.ts || { echo "::error::convex scaffold has no convex/"; exit 1; }

          bna supabase sb --no-auth --skip-supabase --skip-install
          test -f sb/.env.example || { echo "::error::env.example was not renamed"; exit 1; }
          test -d sb/.github        || { echo "::error::github was not renamed"; exit 1; }
          grep -q 'project_id = "sb"' sb/supabase/config.toml \
            || { echo "::error::config.toml project_id was not rewritten"; exit 1; }
          grep -q 'sb://' sb/supabase/config.toml \
            || { echo "::error::config.toml scheme was not rewritten"; exit 1; }

          bna supabase sba --skip-supabase --skip-install
          test -f sba/app/\(auth\)/sign-in.tsx || { echo "::error::auth scaffold missing sign-in"; exit 1; }

      # The scaffold and the registry source have to target the same SDK. They
      # drifted apart once already — starters on SDK 54 while the components
      # were written against 53 — and nothing in the build caught it. This is a
      # static check because `init --skip-install` leaves no node_modules.
      - name: Scaffold targets the same Expo SDK as the registry
        run: |
          set -euo pipefail
          major() { node -p "
            const v = require('$1').${2}.expo;
            /(\d+)/.exec(v.replace(/^[^0-9]*/, ''))[1]
          "; }
          registry=$(major "$GITHUB_WORKSPACE/packages/registry/package.json" devDependencies)
          echo "registry expo SDK $registry"

          scaffold=$(major /tmp/e2e/app/package.json dependencies)
          echo "  init scaffold: $scaffold"
          if [ "$scaffold" != "$registry" ]; then
            echo "::error::scaffold is on Expo SDK $scaffold but components are built against $registry"
            exit 1
          fi

          # Every backend overlay replaces package.json wholesale, so each one
          # pins Expo independently and can drift on its own. Only `init` is
          # scaffolded above, so check the rest statically.
          fail=0
          for pkg in "$GITHUB_WORKSPACE"/packages/starters/overlays/*/package.json; do
            name=$(basename "$(dirname "$pkg")")
            overlay=$(major "$pkg" dependencies)
            echo "  $name overlay: $overlay"
            if [ "$overlay" != "$registry" ]; then
              echo "::error::overlay $name is on Expo SDK $overlay but components are built against $registry"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]

      - name: Every local import resolves in the installed project
        run: |
          cd /tmp/e2e/app
          node --input-type=module -e "
            import { readdir, readFile, access } from 'node:fs/promises';
            import path from 'node:path';
            const roots = ['components', 'hooks', 'theme'];
            const files = [];
            const walk = async (d) => {
              for (const e of await readdir(d, { withFileTypes: true })) {
                const f = path.join(d, e.name);
                if (e.isDirectory()) await walk(f); else files.push(f);
              }
            };
            for (const r of roots) await walk(r).catch(() => {});
            let bad = 0;
            for (const f of files) {
              const src = await readFile(f, 'utf8');
              for (const [, spec] of src.matchAll(/from '@\/([\w/-]+)'/g)) {
                const hit = await Promise.any(
                  ['.ts', '.tsx'].map(ext => access(spec + ext))
                ).then(() => true, () => false);
                if (!hit) { console.error('missing:', spec, 'imported by', f); bad++; }
              }
            }
            if (bad) { console.error(\`\${bad} unresolved imports\`); process.exit(1); }
            console.log(\`ok — \${files.length} installed files, all imports resolve\`);
          "

  # `bunx --bun bna-ui …` runs the CLI under Bun, not Node, and every job above
  # invokes it with `node`. That gap shipped: `bna-ui@2.0.5` scaffolded via
  # fs-extra, whose `copy()` calls `fs.opendir`, which Bun did not implement —
  # so `init` died on a TypeError for every bun user while CI stayed green.
  #
  # The old leg of the matrix is the point of it: it predates several `node:fs`
  # additions, so reaching for one fails here rather than on a user's machine.
  cli-bun:
    name: CLI under Bun ${{ matrix.bun }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ['latest', '1.1.0']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      # Built with Node — only the CLI's own runtime is under test here.
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=bna-ui

      - name: Scaffold under the Bun runtime
        run: |
          set -euo pipefail
          mkdir -p /tmp/e2e-bun && cd /tmp/e2e-bun
          bun "$GITHUB_WORKSPACE/packages/cli/bin/bna-ui.js" init app --skip-install

          cd app
          test -f .gitignore     || { echo "::error::the dot-less rename did not run"; exit 1; }
          test -f components.json || { echo "::error::init produced no components.json"; exit 1; }
          test -f app/_layout.tsx || { echo "::error::nested files were not copied"; exit 1; }
          test ! -d node_modules  || { echo "::error::the skip list was not honoured"; exit 1; }

      # The backend scaffolds are the ones carrying a `github/` directory and an
      # `env.example`, so they cover the directory rename `init` never touches.
      - name: Scaffold a backend variant under the Bun runtime
        run: |
          set -euo pipefail
          mkdir -p /tmp/e2e-bun-backends && cd /tmp/e2e-bun-backends
          bun "$GITHUB_WORKSPACE/packages/cli/bin/bna-ui.js" \
            supabase sb --no-auth --skip-supabase --skip-install

          test -f sb/.env.example || { echo "::error::env.example was not renamed"; exit 1; }
          test -d sb/.github      || { echo "::error::github was not renamed"; exit 1; }

      # Node and Bun must produce byte-identical trees. Both runs scaffold a
      # project named `app`, so even the stamped identity matches and any
      # difference is a real divergence between the two runtimes.
      - name: Bun and Node scaffold identically
        run: |
          set -euo pipefail
          cd /tmp/e2e-bun
          mv app bun-app
          node "$GITHUB_WORKSPACE/packages/cli/bin/bna-ui.js" init app --skip-install
          diff -r bun-app app

      # `add` is the other half of the CLI, and it writes files too — the same
      # class of bug lands there as a component that silently never arrives.
      # `generated/r/` is what the docs site publishes as `/r`, so serving it
      # directly skips building the whole site for four requests.
      - name: Serve the registry
        run: |
          python3 -m http.server 4321 \
            --directory "$GITHUB_WORKSPACE/packages/registry/generated" &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4321/r/index.json > /dev/null && break
            sleep 1
          done

      - name: Add a component and a chart under the Bun runtime
        run: |
          set -euo pipefail
          cd /tmp/e2e-bun/app
          export BNA_UI_REGISTRY=http://localhost:4321/r

          # Neither pulls an npm package the scaffold lacks, so this stays
          # offline after the fetch — no install subprocess involved.
          bun "$GITHUB_WORKSPACE/packages/cli/bin/bna-ui.js" add alert area-chart --yes

          test -f components/ui/alert.tsx \
            || { echo "::error::add wrote no component"; exit 1; }
          test -f components/charts/area-chart.tsx \
            || { echo "::error::add wrote no chart"; exit 1; }
          test -f components/charts/line-chart.tsx \
            || { echo "::error::the chart's registry dependency was not written"; exit 1; }

          # The payload's `@/…` specifiers are frozen at registry build time; a
          # truncated or re-encoded write shows up here first.
          grep -q "from '@/hooks/useColor'" components/ui/alert.tsx \
            || { echo "::error::alert.tsx did not survive the write intact"; exit 1; }

      # The discovery commands share the registry client and its `~/.cache`
      # writes, so they exercise the JSON read/write path `add` depends on.
      - name: Discovery commands under the Bun runtime
        run: |
          set -euo pipefail
          cd /tmp/e2e-bun/app
          export BNA_UI_REGISTRY=http://localhost:4321/r
          bna() { bun "$GITHUB_WORKSPACE/packages/cli/bin/bna-ui.js" "$@"; }

          bna list --type chart | grep -q area-chart
          bna search button | grep -q button
          bna info button --json | node -e "
            let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
              if (JSON.parse(s).name !== 'button') { console.error('::error::info returned the wrong bundle'); process.exit(1); }
            })"
          bna add avatar --dry-run < /dev/null | grep -q 'Dry run'
          test ! -f components/ui/avatar.tsx \
            || { echo '::error::--dry-run wrote a file'; exit 1; }
