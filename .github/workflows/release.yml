name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Both publishable packages, not just the CLI, and this is now the only
      # thing that builds them — neither carries a `prepublishOnly` any more.
      #
      # `--filter` selects a package and its *dependencies*, never its
      # dependents, so filtering on `bna-ui` alone left `@bna-ui/mcp` unbuilt
      # and leaning entirely on its own hook. changesets publishes in parallel,
      # and the CLI's hook opened with `rm -rf dist` — which is the file
      # `@bna-ui/mcp` type-checks `bna-ui/registry` against, so its `tsc` would
      # intermittently die on TS2307 mid-publish. Turbo already knows
      # `@bna-ui/mcp#build` comes after `bna-ui#build`; letting it do the
      # ordering, once, removes the race outright.
      - run: pnpm turbo run build --filter=bna-ui --filter=@bna-ui/mcp

      # Publishing runs on npm trusted publishing (OIDC), so there is no npm
      # token in this workflow at all — see the comment on the changesets step.
      # That needs npm >= 11.5.1, and the runner's Node 22 ships 10.9.
      #
      # It has to be the *global* npm, not a devDependency: changesets shells
      # out to `pnpm publish` (it detects pnpm-lock.yaml), and through pnpm 10.x
      # `pnpm publish` still delegates the upload to whatever `npm` is on PATH.
      # That delegation is what makes OIDC reachable at all here, and it is why
      # `packageManager` must stay on pnpm 10 — pnpm 11 publishes natively and
      # currently 404s under OIDC (pnpm/pnpm#11513). Bumping pnpm to 11 without
      # revisiting this breaks releases.
      - name: Install an npm that can do trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # Opens/updates a "Version Packages" PR; publishes when that PR lands.
      #
      # Ordering note: the docs site (which serves /r/*.json) deploys from this
      # same push via Vercel. Deploying docs before publishing the CLI is always
      # safe — an older CLI reads newer registry entries fine — whereas the
      # reverse can ship a CLI that asks for components the registry lacks.
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN / NODE_AUTH_TOKEN on purpose. `changesets/action`
          # checks the literal `NPM_TOKEN` to decide whether to write an
          # authenticated .npmrc; with it unset the action logs "No NPM_TOKEN
          # found" and falls through to OIDC, which is now the intended path.
          # Auth comes from `id-token: write` above plus a trusted publisher
          # configured on npmjs.com for each package, pinned to this repo and
          # to this filename — renaming this file revokes publishing rights.
          #
          # The one thing OIDC cannot do is create a package that does not
          # exist yet (npm/cli#8544): npmjs.com only lets you attach a trusted
          # publisher to an existing package. The first version of any new
          # `@bna-ui/*` package must go out manually — `pnpm publish --otp` —
          # and get its trusted publisher afterwards. Skipping that is what
          # made `@bna-ui/mcp@1.0.0` fail here with a bare E404 on PUT.
          #
          # Provenance is documented as automatic under trusted publishing, but
          # is cheap to keep explicit and has been reported as still necessary.
          NPM_CONFIG_PROVENANCE: true
